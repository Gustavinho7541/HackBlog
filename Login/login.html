<html lang="pt-br">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container nav-shell">
    <a class="brand" href="../Inicio/index.html" aria-label="HackBlog - Início"><span class="brand-mark">&lt;/&gt;</span><span>Hack<span>Blog</span></span></a>

  </div>
</header>

<main class="container">
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p id="errorMessage" class="error-message"></p>
    </div>
    <script src="script.js"></script>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <div><strong>Hack<span>Blog</span></strong><p>Tecnologia, programação, hardware e cultura digital.</p></div>

  </div>
</footer>
</body>
</html>
